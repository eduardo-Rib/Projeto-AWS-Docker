global
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    default-server init-addr libc,none

frontend http-in
    bind *:80

    acl is_api path_beg /api
    acl is_health path -i /health

    use_backend backend_api if is_api
    use_backend backend_api if is_health
    default_backend frontend_app

backend backend_api
    balance roundrobin

    server b1 backend1:5000 check resolvers docker
    server b2 backend2:5000 check resolvers docker
    server b3 backend3:5000 check resolvers docker

backend frontend_app
    server frontend frontend:80 check resolvers docker

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
